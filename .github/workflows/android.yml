name: Android TV APK (ARMv7)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # tag'te Release oluşturmak için

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Projede gradlew yok; AGP 8.3.2 için Gradle 8.7 kurulur ve önbelleğe alınır.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # İsteğe bağlı: Secrets tanımlıysa kendi anahtarınla imzalar, yoksa debug anahtarı kullanılır.
      - name: Keystore hazırla
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Release APK derle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          gradle :app:assembleRelease --no-daemon --stacktrace
          -PappVersionCode=${{ github.run_number }}
          -PappVersionName=1.0.${{ github.run_number }}

      - name: APK adını düzenle
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/hddshare-armv7-1.0.${{ github.run_number }}.apk"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: hddshare-armv7-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: GitHub Release (v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
